<!doctype html>
<html lang='en'>

<head>
    <script src="https://kit.fontawesome.com/cdd0ffb1dc.js" crossorigin="anonymous"></script>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

    <link rel="stylesheet" href="style.css">
    <title>Hello, Boxicons!</title>
</head>

<body>

    <div class="container">
        <div class="header">
            <h2>Weather</h2>
            <div class="weather-input">
                <input type="text" name="city" id="city_input" placeholder="Enter city name">
                <button type="button" id="searchBtn">
                    <i class="fa-solid fa-magnifying-glass"></i> Search
                </button>
                <button type="button" id="locationBtn">
                    <i class="bx bx-target-lock"></i> Current Location
                </button>
            </div>
        </div>

        <div class="weather-data">
            <div class="weather-left">
                <div class="card">
                    <div class="current-weather">
                        <div class="details">
                            <p>Now</p>
                            <h2>&deg;C</h2>
                            <p></p>
                        </div>
                        <div class="weather-icon">
                            <img src="https://openweathermap.org/img/wn/04d@2x.png" alt="">
                        </div>
                    </div>
                    <hr>
                    <div class="card-footer">
                        <p><i class="fa-regular fa-calendar"></i></p>
                        <p><i class="fa-solid fa-location-dot"></i></p>
                    </div>
                </div>
                <div class="card">
                    <h2>5 Days Forecast</h2>
                    <div class="day-forecast">
                        <div class="forecast-item">
                            <div class="icon-wrapper">
                                <img src="https://openweathermap.org./img/wn/02d.png" alt="">
                                <span>&deg;C</span>
                            </div>
                            <p>-</p>
                            <p>-</p>
                        </div>
                        <div class="forecast-item">
                            <div class="icon-wrapper">
                                <img src="https://openweathermap.org./img/wn/02d.png" alt="">
                                <span>&deg;C</span>
                            </div>
                            <p>-</p>
                            <p>-</p>
                        </div>
                        <div class="forecast-item">
                            <div class="icon-wrapper">
                                <img src="https://openweathermap.org./img/wn/02d.png" alt="">
                                <span>&deg;C</span>
                            </div>
                            <p>-</p>
                            <p>-</p>
                        </div>
                        <div class="forecast-item">
                            <div class="icon-wrapper">
                                <img src="https://openweathermap.org./img/wn/02d.png" alt="">
                                <span>&deg;C</span>
                            </div>
                            <p>-</p>
                            <p>-</p>
                        </div>
                        <div class="forecast-item">
                            <div class="icon-wrapper">
                                <img src="https://openweathermap.org./img/wn/02d.png" alt="">
                                <span>&deg;C</span>
                            </div>
                            <p>-</p>
                            <p>-</p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="weather-right">
                <h2>Today's Highlights</h2>
                <div class="hightlights">
                    <div class="card">
                        <div class="card-head">
                            <p>Air Quality Index</p>
                            <p class="air-index qui-1">Good</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
