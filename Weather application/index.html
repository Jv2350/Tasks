<!doctype html>
<html lang='en'>

<head>
    <script src="https://kit.fontawesome.com/cdd0ffb1dc.js" crossorigin="anonymous"></script>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

    <link rel="stylesheet" href="style.css">
    <title>Hello, Boxicons!</title>
</head>

<body>

    <div class="container">
        <div class="header">
            <h2>__Weather</h2>__
            <div class="weather-input">
                <input type="text" name="city" id="city_input" placeholder="Enter city name">
                <button type="button" id="searchBtn">
                    <i class="fa-solid fa-magnifying-glass"></i> Search
                </button>
                <button type="button" id="locationBtn">
                    <i class="bx bx-target-lock"></i> Current Location
                </button>
            </div>
        </div>

        <div class="weather-data">
            <div class="weather-left">
                <div class="card">
                    <div class="current-weather">
                        <div class="details">
                            <p>Now</p>
                            <h2>__&deg;C</h2>__
                            <p></p>
                        </div>
                        <div class="weather-icon">
                            <img src="https://openweathermap.org/img/wn/04d@2x.png" alt="">
                        </div>
                    </div>
                    <hr>
                    <div class="card-footer">
                        <p><i class="fa-regular fa-calendar"></i></p>
                        <p><i class="fa-solid fa-location-dot"></i></p>
                    </div>
                </div>
                <div class="card">
                    <h2>__5 Days Forecast</h2>__
                    <div class="day-forecast">
                        <div class="forecast-item">
                            <div class="icon-wrapper">
                                <img src="https://openweathermap.org./img/wn/02d.png" alt="">
                                <span>&deg;C</span>
                            </div>
                            <p>-</p>
                            <p>-</p>
                        </div>
                        <div class="forecast-item">
                            <div class="icon-wrapper">
                                <img src="https://openweathermap.org./img/wn/02d.png" alt="">
                                <span>&deg;C</span>
                            </div>
                            <p>-</p>
                            <p>-</p>
                        </div>
                        <div class="forecast-item">
                            <div class="icon-wrapper">
                                <img src="https://openweathermap.org./img/wn/02d.png" alt="">
                                <span>&deg;C</span>
                            </div>
                            <p>-</p>
                            <p>-</p>
                        </div>
                        <div class="forecast-item">
                            <div class="icon-wrapper">
                                <img src="https://openweathermap.org./img/wn/02d.png" alt="">
                                <span>&deg;C</span>
                            </div>
                            <p>-</p>
                            <p>-</p>
                        </div>
                        <div class="forecast-item">
                            <div class="icon-wrapper">
                                <img src="https://openweathermap.org./img/wn/02d.png" alt="">
                                <span>&deg;C</span>
                            </div>
                            <p>-</p>
                            <p>-</p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="weather-right">
                <h2>__Today's Highlights</h2>__
                <div class="highlights">
                    <div class="card">
                        <div class="card-head">
                            <p>Air Quality Index</p>
                            <p class="air-index aqi-1">Good</p>
                        </div>
                        <div class="air-indices">
                            <i class="fa-solid fa-wind fa-3x"></i>
                            <div class="item">
                                <p>PM2.5</p>
                                <h2>__</h2>
                            </div>
                            <div class="item">
                                <p>PM10</p>
                                <h2>__</h2>
                            </div>
                            <div class="item">
                                <p>SO2</p>
                                <h2>__</h2>
                            </div>
                            <div class="item">
                                <p>CO</p>
                                <h2>__</h2>
                            </div>
                            <div class="item">
                                <p>NO</p>
                                <h2>__</h2>
                            </div>
                            <div class="item">
                                <p>NO2</p>
                                <h2>__</h2>
                            </div>
                            <div class="item">
                                <p>Nh2</p>
                                <h2>__</h2>
                            </div>
                            <div class="item">
                                <p>O3</p>
                                <h2>__</h2>
                            </div>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-head">
                            <p>Sunrise & Sunset</p>
                        </div>
                        <div class="sunrise-sunset">
                            <div class="item">
                                <div class="icon">
                                    <i class="fa-solid fa-sun fa-4x"></i>
                                </div>
                                <div>
                                    <p>Sunrise</p>
                                    <h2>__</h2>
                                </div>
                            </div>
                            <div class="item">
                                <div class="icon">
                                    <i class="fa-regular fa-sun fa-4x"></i>
                                </div>
                                <div>
                                    <p>Sunset</p>
                                    <h2>__</h2>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
