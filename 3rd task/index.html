<!-- Tic Tac Toe-Application
To build a tic-tac-toe web application, you can use HTML, CSS, and JavaScript. By implementing functions to handle user
clicks, track game state, and check for winning conditions, you can create an interactive and engaging tic-tac-toe game.
With these technologies and functionalities, users can play against each other or against an AI opponent, aiming to get
three markers in a row to win the game. -->

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <h1>Tic Tac Toe</h1>
    <div id="board" class="board">
      <div>
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
      </div>
      <div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
      </div>
      <div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
      </div>
    </div>
    <div id="status" class="status"></div>
    <button id="restart">Restart Game</button>
  </div>
  <script src="script.js"></script>
</body>

</html>
